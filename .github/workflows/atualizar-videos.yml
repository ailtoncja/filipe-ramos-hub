name: Atualizar catálogo de vídeos
on:
  push:
    paths:
      - scripts/atualizar-videos.mjs
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Buscar vídeos no YouTube
        run: node scripts/atualizar-videos.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Salvar catálogo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/videos.json
          git diff --cached --quiet || (git commit -m 'Atualiza catálogo de vídeos' && git push)
