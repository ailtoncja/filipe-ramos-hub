<section id="lives-avulsas" class="border-t border-zinc-200 py-16 dark:border-violet-500/10">
  <div class="mx-auto max-w-[1600px] px-4 sm:px-6 lg:px-10 xl:px-16">
    <div class="mb-12 section-heading section-heading-stacked">
      <h2 class="font-display text-3xl font-bold tracking-tight text-zinc-900 dark:text-white sm:text-4xl">
        Lives Avulsas
      </h2>
      <p class="mx-auto mt-3 max-w-2xl text-zinc-600 dark:text-zinc-400">
        Aquelas lives que foram parar em cantinhos inesperados do YouTube.
      </p>
    </div>

    @if (livesAvulsas.length === 0) {
      <p class="py-12 text-center text-zinc-500 dark:text-zinc-400">Nenhuma live avulsa cadastrada ainda.</p>
    } @else {
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
        @for (live of livesAvulsas; track live.youtubeUrl) {
          <app-live-avulsa-card [live]="live" />
        }
      </div>
    }
  </div>
</section>
