<header class="site-header">
  <div class="header-inner">
    <a href="#topo" class="header-brand" aria-label="Filipe Ramos Hub, início">
      <img src="https://yt3.googleusercontent.com/6Xp6EWdRKEGrSrhlfDeRM84TLhYPrZafguFDiDrO9NPd1pp5M_DQ3SzcaTv7FPn0OEaJ3bWwvUk=s900-c-k-c0x00ffffff-no-rj" alt="" />
      <span>FILIPE RAMOS <small>HUB</small></span>
    </a>
    <nav class="header-nav" aria-label="Navegação principal">
      <a href="#buscar-videos">Vídeos</a>
      <a href="#canais">Canais</a>
      <a href="#lives-avulsas">Lives avulsas</a>
      <a href="#playlist">Playlist</a>
      <a href="#care-packages">Care Packages</a>
    </nav>
    <button type="button" (click)="toggleTheme()" class="theme-switch" [attr.aria-label]="isDark() ? 'Ativar tema claro' : 'Ativar tema escuro'">
      @if (isDark()) {
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
      } @else {
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20.5 14.3A8.5 8.5 0 0 1 9.7 3.5 8.5 8.5 0 1 0 20.5 14.3Z"/></svg>
      }
    </button>
  </div>
</header>
