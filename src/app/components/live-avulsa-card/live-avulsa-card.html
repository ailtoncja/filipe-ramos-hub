<a
  [href]="live().youtubeUrl"
  target="_blank"
  rel="noopener noreferrer"
  class="group flex flex-col overflow-hidden rounded-xl border border-zinc-200 bg-white transition hover:-translate-y-1 hover:border-violet-400 hover:shadow-[0_0_30px_-8px] hover:shadow-violet-500/50 dark:border-zinc-800 dark:bg-white/[0.03] dark:hover:border-violet-500/60"
>
  <div class="relative aspect-video w-full overflow-hidden bg-zinc-100 dark:bg-black/40">
    @if (thumbnailUrl()) {
      <img
        [src]="thumbnailUrl()"
        [alt]="live().titulo"
        class="h-full w-full object-cover transition duration-300 group-hover:scale-105"
      />
    }
    <div class="absolute inset-0 bg-black/10 transition group-hover:bg-black/25"></div>
    <span
      class="absolute inset-0 flex items-center justify-center text-3xl text-white opacity-90 drop-shadow transition group-hover:scale-110"
      aria-hidden="true"
    >
      ▶️
    </span>
    <span
      class="absolute right-2 top-2 rounded-full bg-black/60 px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider text-white backdrop-blur"
    >
      Avulsa
    </span>
  </div>
  <div class="flex flex-1 flex-col p-4">
    <h3 class="font-display line-clamp-2 text-sm font-semibold text-zinc-900 dark:text-white">
      {{ live().titulo }}
    </h3>
    <span class="mt-2 text-xs font-medium text-zinc-500 dark:text-zinc-400">{{ live().canal }}</span>
    <span class="mt-3 text-sm font-medium text-violet-600 group-hover:underline dark:text-violet-400">
      Assistir →
    </span>
  </div>
</a>
