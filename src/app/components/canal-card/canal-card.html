<a [href]="canal().youtubeUrl" target="_blank" rel="noopener noreferrer" class="channel-card">
  <img [src]="canal().avatarUrl" alt="" loading="lazy" />
  <div><span class="channel-type">{{ badgeLabel() }}</span><h3>{{ canal().nomeExibicao }}</h3><p>{{ canal().descricao }}</p></div>
  <span class="channel-arrow" aria-hidden="true">↗</span>
</a>
