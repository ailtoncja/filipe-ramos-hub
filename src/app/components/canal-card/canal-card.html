<a
  [href]="canal().youtubeUrl"
  target="_blank"
  rel="noopener noreferrer"
  class="group relative flex flex-col items-center overflow-hidden rounded-xl border border-zinc-200 bg-white p-6 text-center transition hover:-translate-y-1 hover:border-violet-400 hover:shadow-[0_0_30px_-8px] hover:shadow-violet-500/50 dark:border-zinc-800 dark:bg-white/[0.03] dark:hover:border-violet-500/60"
>
  <span
    class="absolute left-0 top-0 h-6 w-6 rounded-br-lg border-b border-r border-violet-500/0 transition group-hover:border-violet-500/60"
  ></span>
  <span
    class="absolute right-0 top-0 rounded-bl-lg px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider"
    [class]="badgeClasses()"
  >
    {{ badgeLabel() }}
  </span>

  <img
    [src]="canal().avatarUrl"
    [alt]="canal().nome"
    class="h-24 w-24 rounded-full object-cover ring-2 ring-zinc-100 transition group-hover:ring-violet-400 dark:ring-zinc-800 dark:group-hover:ring-violet-500"
  />
  <h3 class="mt-4 font-display text-lg font-semibold text-zinc-900 dark:text-white">{{ canal().nome }}</h3>
  <span class="mt-4 text-sm font-medium text-violet-600 group-hover:underline dark:text-violet-400">
    Ver canal →
  </span>
</a>
