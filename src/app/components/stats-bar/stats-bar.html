<div class="flex flex-wrap items-center justify-center gap-3">
  @for (stat of stats; track stat.rotulo) {
    <div
      class="flex items-center gap-2.5 rounded-lg border border-zinc-200 bg-white/60 px-4 py-2 dark:border-violet-500/20 dark:bg-white/[0.03]"
    >
      <span class="font-display text-xl font-bold text-violet-600 dark:text-violet-400">{{ stat.valor }}</span>
      <span class="text-xs font-medium uppercase tracking-wider text-zinc-500 dark:text-zinc-400">{{ stat.rotulo }}</span>
    </div>
  }
</div>
